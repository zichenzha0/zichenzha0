name: Live profile

on:
  schedule:
    - cron: "7 * * * *" # every hour
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: zichenzha0

      - name: Keep only the graph the README uses
        run: find profile-3d-contrib -type f ! -name 'profile-night-rainbow.svg' -delete

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Latest commits feed
        env:
          # Optional PROFILE_TOKEN: fine-grained token limited to the DawnTale repos,
          # so their commits show up too. Without it the feed uses public repos only.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: zichenzha0
          SHOW_PRIVATE: dawntale,dawntale-community
        run: |
          pip install -q -r requirements.txt
          python scripts/update_activity.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md profile-3d-contrib
          git diff --cached --quiet || { git commit -m "⚡ live profile refresh"; git pull --rebase; git push; }

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: zichenzha0
          outputs: |
            dist/github-snake.svg?color_snake=#ff7a59
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff7a59

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
